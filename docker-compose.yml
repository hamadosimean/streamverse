# StreamVerse — full stack, one command:  docker compose up --build
#
# Host ports are deliberately non-default so this stack can sit alongside other
# projects on the same server:
#   8110 app (nginx)   5459 postgres   6402 redis   5574 flower
#   8045 mailpit UI    9010 minio API  9011 minio console
#   1936 RTMP ingest (MediaMTX). HLS output is proxied by nginx at /live-hls/.

name: streamverse

x-backend-env: &backend-env
  DEBUG: ${DEBUG:-0}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8110}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8110}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8110}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

  # Public identity for sitemap.xml, robots.txt and Open Graph tags, which must
  # emit absolute URLs and have no request to derive them from.
  SITE_URL: ${SITE_URL:-http://localhost:8110}
  SITE_NAME: ${SITE_NAME:-StreamVerse}
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
  CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-0}

  POSTGRES_DB: ${POSTGRES_DB:-streamverse}
  POSTGRES_USER: ${POSTGRES_USER:-streamverse}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamverse}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432

  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_URL: redis://redis:6379/0
  CHANNEL_REDIS_URL: redis://redis:6379/1
  CACHE_REDIS_URL: redis://redis:6379/2
  CELERY_BROKER_URL: redis://redis:6379/3

  MINIO_HOST: minio
  MINIO_PORT: 9000
  MINIO_ENDPOINT: http://minio:9000
  # Signed against the host the BROWSER uses — see apps/core/storage.py.
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9010}
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-streamverse}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-streamverse-secret}
  MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:-streamverse-public}
  MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-streamverse-private}

  EMAIL_HOST: mailpit
  EMAIL_PORT: 1025
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@streamverse.local}

  UPLOAD_SCRATCH_DIR: /data/uploads
  TRANSCODE_WORK_DIR: /data/work
  FFMPEG_PRESET: ${FFMPEG_PRESET:-veryfast}
  FFMPEG_VIDEO_ENCODER: ${FFMPEG_VIDEO_ENCODER:-libx264}
  HLS_SEGMENT_SECONDS: ${HLS_SEGMENT_SECONDS:-4}

  LIVE_RTMP_APP: ${LIVE_RTMP_APP:-live}
  LIVE_RTMP_PUBLIC_URL: ${LIVE_RTMP_PUBLIC_URL:-rtmp://localhost:1936}
  LIVE_HLS_PUBLIC_PATH: ${LIVE_HLS_PUBLIC_PATH:-/live-hls}
  LIVE_MEDIAMTX_API: http://mediamtx:9997
  LIVE_HOOK_SECRET: ${LIVE_HOOK_SECRET:-change-me-live-hook-secret}
  LIVE_RECORDINGS_DIR: /data/recordings

  PAYMENTS_USE_MOCK: ${PAYMENTS_USE_MOCK:-1}
  MOCK_PAYMENT_WEBHOOK_SECRET: ${MOCK_PAYMENT_WEBHOOK_SECRET:-change-me-mock-webhook-secret}
  MOCK_PAYMENT_CONFIRM_DELAY_SECONDS: ${MOCK_PAYMENT_CONFIRM_DELAY_SECONDS:-8}
  MOCK_PAYMENT_FAILURE_PERCENT: ${MOCK_PAYMENT_FAILURE_PERCENT:-15}
  PAYMENT_PENDING_TIMEOUT_MINUTES: ${PAYMENT_PENDING_TIMEOUT_MINUTES:-30}
  ADS_ENABLED: ${ADS_ENABLED:-1}
  ADS_MIN_DURATION_FOR_MIDROLL: ${ADS_MIN_DURATION_FOR_MIDROLL:-120}
  INTERNAL_API_BASE_URL: http://backend:8000

  VIEW_MIN_SECONDS: ${VIEW_MIN_SECONDS:-30}
  VIEW_DEDUP_WINDOW_SECONDS: ${VIEW_DEDUP_WINDOW_SECONDS:-43200}
  SEARCH_LANGUAGE_CONFIG: ${SEARCH_LANGUAGE_CONFIG:-french}

x-backend-volumes: &backend-volumes
  - upload_scratch:/data/uploads
  - transcode_work:/data/work
  # Written by MediaMTX, read by the Celery worker that converts a finished
  # broadcast into a normal VOD.
  - live_recordings:/data/recordings
  - static:/app/staticfiles

services:
  db:
    image: postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streamverse}
      POSTGRES_USER: ${POSTGRES_USER:-streamverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamverse}
    volumes:
      # Postgres 18+ images expect the mount at /var/lib/postgresql (not
      # .../data) so the server can keep major-version-specific subdirectories
      # and `pg_upgrade --link` stays possible across a mount boundary.
      - postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_HOST_PORT:-5459}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamverse} -d ${POSTGRES_DB:-streamverse}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.10-trixie
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6402}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    # Pinned deliberately: MinIO stripped the embedded web Console from later
    # community releases. This is the newest tag that still ships a usable
    # bucket browser on :9001, which the demo relies on for inspecting the
    # public/private split by hand.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-streamverse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-streamverse-secret}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_HOST_PORT:-9010}:9000"     # S3 API — the browser fetches HLS here
      - "${MINIO_CONSOLE_HOST_PORT:-9011}:9001" # web console
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.30
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_HOST_PORT:-8045}:8025"

  backend:
    build:
      context: ./backend
    # The four services below share one image on purpose. Building them under
    # separate implicit names lets `docker compose build backend` leave the
    # worker running stale code — a failure mode that is invisible until a task
    # silently behaves like an older revision.
    image: streamverse-backend:local
    restart: unless-stopped
    command: ["asgi"]
    environment:
      <<: *backend-env
      SEED_ON_START: ${SEED_ON_START:-1}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    volumes: *backend-volumes
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  celery-worker:
    build:
      context: ./backend
    image: streamverse-backend:local
    restart: unless-stopped
    command: ["worker"]
    environment:
      <<: *backend-env
      # Transcoding is CPU-bound: match this to real cores, not to an arbitrary
      # number. See README "Performance & scaling".
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
    volumes: *backend-volumes
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  celery-beat:
    build:
      context: ./backend
    image: streamverse-backend:local
    restart: unless-stopped
    command: ["beat"]
    environment: *backend-env
    volumes: *backend-volumes
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  flower:
    build:
      context: ./backend
    image: streamverse-backend:local
    restart: unless-stopped
    command: ["flower"]
    environment:
      <<: *backend-env
      FLOWER_USER: ${FLOWER_USER:-admin}
      FLOWER_PASSWORD: ${FLOWER_PASSWORD:-admin}
    ports:
      - "${FLOWER_HOST_PORT:-5574}:5555"
    depends_on:
      redis: {condition: service_healthy}

  mediamtx:
    # RTMP ingest + HLS repackaging. The `-ffmpeg` variant is alpine-based, so it
    # has the shell and `wget` the lifecycle hooks need; the default image is
    # scratch-based and cannot run them.
    image: bluenviron/mediamtx:1.20.0-ffmpeg
    restart: unless-stopped
    environment:
      # Substituted into the runOnReady / runOnNotReady commands.
      MTX_HOOK_SECRET: ${LIVE_HOOK_SECRET:-change-me-live-hook-secret}
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - live_recordings:/recordings
    ports:
      # Only RTMP is published. HLS (:8888) is proxied by nginx and the control
      # API (:9997) stays internal.
      - "${RTMP_HOST_PORT:-1936}:1935"
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-/ws}
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:1.30-trixie
    restart: unless-stopped
    environment:
      # The image runs envsubst over /etc/nginx/templates/*.template at start.
      # The FILTER is essential: without it envsubst would also eat nginx's own
      # $host, $request_uri and friends, leaving an empty config.
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-http://localhost:9010}"
      NGINX_ENVSUBST_FILTER: "^MINIO_PUBLIC_ENDPOINT$$"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - static:/var/www/static:ro
    ports:
      - "${APP_HOST_PORT:-8110}:80"
    depends_on:
      - backend
      - frontend
      - mediamtx

volumes:
  postgres_data:
  redis_data:
  minio_data:      # replaces a local file volume — grows fast with multi-rendition HLS
  static:
  upload_scratch:  # tus chunks + source files, shared between backend and worker
  transcode_work:  # ffmpeg scratch space, swept by a beat task
  live_recordings: # MediaMTX session recordings, pruned once converted to VOD
