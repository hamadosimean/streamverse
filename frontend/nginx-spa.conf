# Static SPA server. Client-side routing means any unknown path must fall back
# to index.html rather than 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames, so assets are safe to cache forever.
    # One explicit Cache-Control rather than `expires` plus an add_header: those
    # two emit a second, conflicting Cache-Control, and which one a cache honours
    # is not something to leave to chance.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # index.html must never be cached, or a deploy leaves clients on stale asset refs.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
