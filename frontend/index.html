<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b12" />

    <title>StreamVerse — Partagez et decouvrez des videos</title>
    <meta
      name="description"
      content="StreamVerse est une plateforme de partage video : televersez vos videos, suivez vos chaines preferees, regardez des Shorts et des directs."
    />
    <!-- Defaults only. Every route overwrites these at runtime via
         useDocumentMeta, and link-unfurling crawlers (which run no JavaScript)
         are served pre-rendered tags by the backend instead. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-video-preview:-1" />
    <meta name="author" content="StreamVerse" />
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:site_name" content="StreamVerse" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="StreamVerse — Partagez et decouvrez des videos" />
    <meta
      property="og:description"
      content="Televersez vos videos, suivez vos chaines preferees, regardez des Shorts et des directs."
    />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StreamVerse" />
    <meta
      name="twitter:description"
      content="Televersez vos videos, suivez vos chaines preferees, regardez des Shorts et des directs."
    />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <!-- iOS composites the touch icon onto white, so that one carries the
         brand plate rather than transparency. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      StreamVerse a besoin de JavaScript pour lire les videos. /
      StreamVerse needs JavaScript to play videos.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
